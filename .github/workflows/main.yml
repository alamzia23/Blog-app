name: Build and publish blog image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_REPOSITORY: ${{ secrets.AWS_REGISTRY_URL }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker build --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" .
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Check out Helm chart repository
        uses: actions/checkout@v4
        with:
          repository: alamzia23/NewBlog-HelmCharts
          token: ${{ secrets.TOKEN }}
          path: chart

      - name: Update chart image and push desired state
        env:
          IMAGE_REPOSITORY: ${{ secrets.AWS_REGISTRY_URL }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd chart
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("values.yaml")
          text = path.read_text()
          text, repo_count = re.subn(r"(?m)^(    repository: ).+$", lambda m: m.group(1) + os.environ["IMAGE_REPOSITORY"], text, count=1)
          text, tag_count = re.subn(r"(?m)^(    tag: ).+$", lambda m: m.group(1) + os.environ["IMAGE_TAG"], text, count=1)
          if repo_count != 1 or tag_count != 1:
              raise SystemExit("Expected one image repository and tag entry under BlogDeployment.image")
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add values.yaml
          git commit -m "Update blog image to ${IMAGE_TAG}"
          git push origin HEAD:main
